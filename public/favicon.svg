<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C81036" />
      <stop offset="50%" stop-color="#8B001F" />
      <stop offset="100%" stop-color="#090D15" />
    </linearGradient>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#C5A15C" />
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <path d="M32 4 L56 12 V32 C56 46 44 56 32 60 C20 56 8 46 8 32 V12 Z" fill="url(#shieldGrad)" stroke="url(#platGrad)" stroke-width="2" />
  <!-- Inner Rim -->
  <path d="M32 8 L52 15 V32 C52 43 42 52 32 55 C22 52 12 43 12 32 V15 Z" fill="#090D15" opacity="0.8" stroke="url(#goldGrad)" stroke-width="0.75" />
  <!-- Monogram MRK -->
  <text x="32" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="url(#platGrad)" text-anchor="middle" letter-spacing="1">MRK</text>
  <text x="32" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">ADELAIDE</text>
</svg>
